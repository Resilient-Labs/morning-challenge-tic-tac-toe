<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruit Slot Machine</title>
  <link rel="stylesheet" href="tic tac project css.css">
</head>

<body>
    <h1>TICK TACK TOE</h1>
    <h2 id="alerts">X GOES FIRST</h2>
  <div class="juego">
<div class="sqr" id="upperLeft" onclick="takeTurn(this)"> </div>
<div class="sqr" id="upperMiddle" onclick="takeTurn(this)"> </div>
<div class="sqr" id="upperRight" onclick="takeTurn(this)"> </div>
<div class="sqr" id="middleLeft" onclick="takeTurn(this)"> </div>
<div class="sqr" id="middleMiddle" onclick="takeTurn(this)"> </div>
<div class="sqr" id="middleRight" onclick="takeTurn(this)"> </div>
<div class="sqr" id="bottomLeft" onclick="takeTurn(this)"> </div>
<div class="sqr" id="bottomMiddle" onclick="takeTurn(this)"> </div>
<div class="sqr" id="bottomRight" onclick="takeTurn(this)"> </div> 
  </div>

  <button onclick="resetBoard()">RESET BOARD</button>
  <p id="infor"></p>
  

</body>
<script src="tic tac project js.js"></script>



</html>
