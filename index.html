<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="description" >
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="board">
      <section class="topThree">
        <div id="topLeft"></div>
        <div id="topMiddle"></div>
        <div id="topRight"></div>
      </section>
      <section class="middleThree">
        <div id="middleLeft"></div>
        <div id="middle"></div>
        <div id="middleRight"></div>
      </section>
      <section class="bottomThree">
        <div id="bottomLeft"></div>
        <div id="bottomMiddle"></div>
        <div id="bottomRight"></div>
      </section>
    </div>
    

    <script src="js/main.js"></script>
  </body>
</html>
