<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Tic-Tac-Toe</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Rubik+Burned&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <section class="title">
            <h1>Let's Play Tic-Tac-Toe</h1>
        </section>
        <section class="description">
            <h2></h2>
            <button>Play Again?</button>
        </section>
        <section class="container">
            <section class="row top">
                <section class="square col1" id="topLeft"></section>
                <section class="square col2" id="topMid"></section>
                <section class="square col3" id="topRight"></section>
            </section>
            <section class="row middle">
                <section class="square col1" id="midLeft"></section>
                <section class="square col2" id="midMid"></section>
                <section class="square col3" id="midRight"></section>
            </section>
            <section class="row bottom">
                <section class="square col1" id="botLeft"></section>
                <section class="square col2" id="botMid"></section>
                <section class="square col3" id="botRight"></section>
            </section>
        </section>
        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
