<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="fullcontainer">
        <h1>Play Tic-Tac-Toe!</h1>

        <section id="cellcontainer">
            <div cell="1" class="cell"></div>
            <div cell="2" class="cell"></div>
            <div cell="3" class="cell"></div>
            <div cell="4" class="cell"></div>
            <div cell="5" class="cell"></div>
            <div cell="6" class="cell"></div>
            <div cell="7" class="cell"></div>
            <div cell="8" class="cell"></div>
            <div cell="9" class="cell"></div>
        </section>
    
        <button id="startbtn">Clear</button>
    </div>




    <script type="text/javascript" src="js/main.js"></script>
</body>
</html>
