<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/tictac.css"></link>
    <title>Tic Tac Toe</title>
</head>
<body>
    <h1>Tic-Tac-Toe</h1>
   <section>
        <div class="row row1 clearfix">
            <div id="cell" data-index="0"></div>
            <div id="cell" data-index="1"></div>
            <div id="cell" data-index="2"></div>
        </div>
        <div class="row row2 clearfix">
            <div id="cell" data-index="3"></div>
            <div id="cell" data-index="4"></div>
            <div id="cell" data-index="5"></div>
        </div>
        <div class="row row3 clearfix">
            <div id="cell" data-index="6"></div>
            <div id="cell" data-index="7"></div>
            <div id="cell" data-index="8"></div>
        </div>
    </section>
    <h2>Result</h2>
    <button id="restart"></button>
    <script src="assets/tictac.js"></script>
</body>
</html>
