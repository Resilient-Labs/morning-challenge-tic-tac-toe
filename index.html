<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Great+Vibes&family=Nabla&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Press+Start+2P&family=Roboto:ital,wght@0,100..900;1,100..900&family=Style+Script&display=swap"
        rel="stylesheet">
</head>

<body>
    <h1 id="winner"></h1>
    <div class="game-container">
        <div class="row">
            <div class="square" data-row="0" data-col="0"></div>
            <div class="square" data-row="0" data-col="1"></div>
            <div class="square" data-row="0" data-col="2"></div>
        </div>
        <div class="row">
            <div class="square" data-row="1" data-col="0"></div>
            <div class="square" data-row="1" data-col="1"></div>
            <div class="square" data-row="1" data-col="2"></div>
        </div>
        <div class="row">
            <div class="square" data-row="2" data-col="0"></div>
            <div class="square" data-row="2" data-col="1"></div>
            <div class="square" data-row="2" data-col="2"></div>
        </div>
        <button id="reset-button">Reset Game</button>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
