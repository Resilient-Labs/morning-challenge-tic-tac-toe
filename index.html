<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="css/normalize.css">
	<link rel="stylesheet" href="css/style.css">

</head>

<body>
    <main> 
        <h1>Let's Play Tic-Tac-Toe!</h1>

          <!-- 3x3 Grid with 9 squares-->
    <div id="board">
        <div class="space" data-index="0"></div>
        <div class="space" data-index="1"></div>
        <div class="space" data-index="2"></div>
        <div class="space" data-index="3"></div>
        <div class="space" data-index="4"></div>
        <div class="space" data-index="5"></div>
        <div class="space" data-index="6"></div>
        <div class="space" data-index="7"></div>
        <div class="space" data-index="8"></div>
    </div>

    <div id="status"></div>

    <button id="restart">Restart</button>

    </main>


	    <script type="text/javascript" src="js/main.js"></script>
</body>
</html>
