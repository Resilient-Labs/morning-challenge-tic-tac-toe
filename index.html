<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Tic-Tac-Toe</h1>

    <div class="game-board">
        <div class="box box1" data-index="0"></div>
        <div class="box box2" data-index="1"></div>
        <div class="box box3" data-index="2"></div>
        <div class="box box4" data-index="3"></div>
        <div class="box box5" data-index="4"></div>
        <div class="box box6" data-index="5"></div>
        <div class="box box7" data-index="6"></div>
        <div class="box box8" data-index="7"></div>
        <div class="box box9" data-index="8"></div>
    </div>
    <button type="button">Reset</button>
    <h2>And the winner is...</h2>

    <script type="text/javascript" src="js/object.js"></script>
</body>
</html>
