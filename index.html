<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="css/style.css">
    <title>Tic Tac Toe Game Using OOP principles</title>

</head>
<body>
    <section class="players">
        <!-- Player One -->
    <div>
        <h3>Player One</h3>
        <p id="scoreX">0</p>
    </div>

    <!-- Player Two -->
       <div>
        <h3>Player Two</h3>
        <p id="scoreO">0</p>
    </div>
      
    </section>
    <div class="tic-tac-toe-container">
        <div class="box" data-index="0"></div>
        <div class="box" data-index="1"></div>
        <div class="box" data-index="2"></div>
        <div class="box" data-index="3"></div>
        <div class="box" data-index="4"></div>
        <div class="box" data-index="5"></div>
        <div class="box" data-index="6"></div>
        <div class="box" data-index="7"></div>
        <div class="box" data-index="8"></div>
    </div>

    <button type="button" >New Game</button>

    <!-- <img src="images/images.jpeg" alt="image for wiiner"> -->
     <script src="index.html"></script>
    <script src="js/OOP.js"></script>
</body>
</html>
