<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/main.css">
        <title>Tic-Tac-Toe</title>
    </head>

    <body>

        <h1>Tic-Tac-Toe</h1>
        <h3>Player One's tile is: <span id="one"></span></h3>
        
        <h3>Player Two's tile is: <span id="two"></span></h3>

        <h4>Turn Counter: <span id="counter">0</span></h4>
        
        <h2></h2>
        <button id="randomizer">X or O?</button>
        
        <main>
            <section>
                <div index="0"></div>

                <div index="1"></div>

                <div index="2"></div>
            </section>

            <section>
                <div index="3"></div>

                <div index="4"></div>

                <div index="5"></div>
            </section>

            <section>
                <div index="6"></div>

                <div index="7"></div>

                <div index="8"></div>
            </section>
        </main>

        <button id="reset">Reset</button>

        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
