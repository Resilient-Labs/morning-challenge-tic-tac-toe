<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link href="css/styles.css" rel="stylesheet" />
</head>

<body>
    <h1>Tic-Tac-Toe</h1>
    <div class="board">
        <div class="box" id="square0"></div>
        <div class="box" id="square1"></div>
        <div class="box" id="square2"></div>
        <div class="box" id="square3"></div>
        <div class="box" id="square4"></div>
        <div class="box" id="square5"></div>
        <div class="box" id="square6"></div>
        <div class="box" id="square7"></div>
        <div class="box" id="square8"></div>
    </div>

    <div class="message-area" id="message"></div>
    <button id="reset">Reset Game</button>

    <script src="js/app.js"></script>
</body>

</html>
