<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="Your description goes here">
	<meta name="keywords" content="one, two, three">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Tic-Tac-Toe</title>

	<!-- external CSS link -->
	<link rel="stylesheet" href="css/reset.css">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>

	<main>
		<div class="display">
			<h1 class="turn-label">Turn</h1>
			<h1 class="turn"></h1>
		</div>
		<section id="game-grid">
			<div id="11" class="grid-cell"></div>
			<div id="12" class="grid-cell"></div>
			<div id="13" class="grid-cell"></div>
			<!--  ROW 2-->
			<div id="21" class="grid-cell"></div>
			<div id="22" class="grid-cell"></div>
			<div id="23" class="grid-cell"></div>
			<!--  ROW 3-->
			<div id="31" class="grid-cell"></div>
			<div id="32" class="grid-cell"></div>
			<div id="33" class="grid-cell"></div>
		</section>
		<button class="clear">Forfeit</button>
		<table>
			<thead>
				<th>X</th>
				<th>O</th>
			</thead>
			<tbody>
				<tr>
					<td id="xwin">0</td>
					<td id="owin">0</td>
				</tr>
			</tbody>
		</table>
	</main>


	<script type="text/javascript" src="js/main.js"></script>
</body>

</html>
