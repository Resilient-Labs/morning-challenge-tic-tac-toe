<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tictactoe.css">
    <title>Tic-Tac-Toe Game</title>
</head>

<body>
    <h1>Let's Play Tic-Tac-Toe</h1>
    <section>

        <div id="container">
            <button onclick="0" id="block"></button>
            <button onclick="1" id="block"></button>
            <button onclick="2" id="block"></button>
            <button onclick="3" id="block"></button>
            <button onclick="4" id="block"></button>
            <button onclick="5" id="block"></button>
            <button onclick="6" id="block"></button>
            <button onclick="7" id="block"></button>
            <button onclick="8" id="block"></button>
        </div>
    </section>

    <h2 id="placeHolder">Player's turn</h2>


    <script src="tictactoe.js"></script>
</body>

</html>
