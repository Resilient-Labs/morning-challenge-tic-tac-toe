	<body>
        <h1>Tic Tac Toe</h1>
        <div class="gameBoard">
            <button class="space" id="zero"></button>
            <button class="space" id="one"></button>
            <button class="space" id="two"></button>
            <button class="space" id="three"></button>
            <button class="space" id="four"></button>

            <button class="space" id="eight"></button>

        </div>
