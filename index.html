<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="description" content="Two player Tic-Tac-Toe - click to place your X or O">
		<meta name="keywords" content="javascript, tic tac toe, class, object, array">

		<title>Tic-Tac-Toe</title>

		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>

		<h1>Tic-Tac-Toe</h1>
		<h2 id="message">Player 1's turn (X)</h2>

		<div id="board">
			<div class="cell" data-index="0"></div>
			<div class="cell" data-index="1"></div>
			<div class="cell" data-index="2"></div>
			<div class="cell" data-index="3"></div>
			<div class="cell" data-index="4"></div>
			<div class="cell" data-index="5"></div>
			<div class="cell" data-index="6"></div>
			<div class="cell" data-index="7"></div>
			<div class="cell" data-index="8"></div>
		</div>

		<button id="reset-btn" type="button">Reset Game</button>

		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>
