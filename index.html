<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/main.css">
        <title>Tic-Tac-Toe</title>
    </head>

    <body>

        <h1>Tic-Tac-Toe</h1>
        
        <h2 id="gameStatus"></h2>
        <h3 id="endStatus"></h2>
        
        <main>
            <section>
                <div index="0" class="tile"></div>
                <div index="1" class="tile"></div>
                <div index="2" class="tile"></div>
            </section>

            <section>
                <div index="3" class="tile"></div>
                <div index="4" class="tile"></div>
                <div index="5" class="tile"></div>
            </section>

            <section>
                <div index="6" class="tile"></div>
                <div index="7" class="tile"></div>
                <div index="8" class="tile"></div>
            </section>
        </main>

        <button id="reset">Reset</button>

        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
