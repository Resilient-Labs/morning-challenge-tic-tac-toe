<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Game ON!</title>
</head>

<body>
    <div class="root">
        <button id="Music"><i class="fa-solid fa-music"></i></button>
        <button id="Music-1"><i class="fa-solid fa-volume-xmark"></i></button>
    </div>
    <main>
        <h1>Tic-Tac-Toe 3 in a Row!</h1>
        <h2></h2>
        <section>
            <p class="cell"></p>
            <p class="cell"></p>
            <p class="cell"></p>
            <p class="cell"></p>
            <p class="cell"></p>
            <p class="cell"></p>
            <p class="cell"></p>
            <p class="cell"></p>
            <p class="cell"></p>
        </section>
        <h3></h3>
        <div>
            <button type="submit" id="reset">Rematch</button>
            <button type="submit" id="reset-all">Start Over</button>
        </div>
        <audio id="game-track" src="assets/audio/gameTrack.wav">Your browser does not support this type of audio
            file.</audio>
        <audio id="clap" src="assets/audio/clap.wav">Your browser does not support this type of audio file.</audio>
        <audio id="click" src="assets/audio/click.wav">Your browser does not support this type of audio file.</audio>

    </main>
</body>
<script type="text/javascript" src="assets/js/game.js"></script>

</html>
